; Sensor probe — Arduino Nano 33 BLE (nRF52840, 3.3 V logic, NOT 5 V tolerant).
;
; A command shell over USB serial for poking at unknown lidar / radar modules.
; Drive it with tools/probe.py; see README.md for wiring and the command list.

[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
monitor_speed = 115200
build_flags = -Wall
